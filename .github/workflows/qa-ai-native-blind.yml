name: SourceRating isolated AI-native static gates
on:
  push:
    branches:
      - test/ai-native-blind-eval-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check AI-native SourceRating P0 integration points
        run: node qa/static-gates.mjs
